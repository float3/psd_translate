name: Weekly

# Two things rot here without a commit to trigger CI: ruff, which is installed
# unpinned and gains a lint with every release, and psd-tools, which is held
# only by a lower bound and has already renamed things out from under this
# repository.
#
# There is still no job for the translation itself: google_trans_new is
# unmaintained and answers 404, so psd_translate cannot translate at all. A
# live job belongs here once it speaks the endpoint directly, the way
# GoogleTranslate.NET's weekly run watches its own.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install Ruff
        run: pip install ruff

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check .

  psd:
    name: Read a psd with current psd-tools
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install the requirements
        run: pip install -r requirements.txt

      # psd_test walks every layer of every .psd beside it, so it runs from
      # tests/ and PYTHONPATH has to be absolute.
      - name: Read the test psd
        run: python -m psd_test
        env:
          PYTHONPATH: ${{ github.workspace }}/src/psd_translate
        working-directory: tests
