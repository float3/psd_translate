name: Weekly

# Ruff is installed unpinned and gains lints with every release, so it can go
# red here without a commit to trigger CI.
#
# There is no job for the translation itself yet. src/psd_translate's two
# scripts do not run against current dependencies: translate_test gets a 404
# from google_trans_new, which is unmaintained and speaks an endpoint google
# has retired, and psd_test calls has_fill() on a Group, which psd-tools no
# longer has. Once those are fixed, a live job belongs here, the way
# GoogleTranslate.NET's weekly run watches its own endpoint.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install Ruff
        run: pip install ruff

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check .
